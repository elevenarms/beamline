[project]
name = "beamline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "google-genai>=1.0",
  "sse-starlette>=2.1",
  "manifold3d>=3.5.4",
  "trimesh>=5.2.0",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
